<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Simi(a)live</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d0605;--um:#2a0f0c;--cr:#882720;--cr2:#b8372b;--cream:#F6F3EA;--mut:#cdbfa8}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;-webkit-text-size-adjust:100%}
body{font:400 16px/1.55 'Prompt',system-ui,sans-serif;color:var(--cream);background:#0d0605;overflow-x:hidden}
button{touch-action:manipulation;font:inherit}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,#5a1a14,#240d0a 50%,#0d0605 100%);overflow:hidden}
.bg::before{content:'';position:absolute;inset:-25%;background:repeating-conic-gradient(from 188deg at 50% -8%,rgba(246,243,234,.075) 0 3deg,transparent 3deg 9deg);-webkit-mask:linear-gradient(#000,transparent 75%);mask:linear-gradient(#000,transparent 75%);animation:sway 14s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(5deg)}}
.bg::after{content:'';position:absolute;inset:0;transition:.8s;background:radial-gradient(ellipse 45% 40% at 100% 0%,rgba(150,40,30,calc(.4 + var(--heat,0)*.5)),transparent 70%),radial-gradient(ellipse 90% 50% at 50% 115%,rgba(190,50,35,calc(var(--heat,0)*.55)),transparent 70%),radial-gradient(ellipse 100% 100% at 50% 50%,transparent 50%,#000c 100%)}
#petals{position:fixed;inset:0;pointer-events:none;z-index:1}
#petals i{position:absolute;top:-5vh;background:linear-gradient(135deg,#F6F3EA,#882720);border-radius:0 100% 0 100%;opacity:.6;animation:fall linear infinite}
@keyframes fall{to{transform:translate(60px,108vh) rotate(540deg)}}
@media(prefers-reduced-motion:reduce){#petals,.bg::before{display:none}}
main{position:relative;z-index:2}
.scr{display:none;position:relative;min-height:100dvh;flex-direction:column;align-items:center;justify-content:center;padding:28px max(18px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));text-align:center;gap:16px}
.scr.on{display:flex;animation:scr .7s ease both}
@keyframes scr{from{opacity:0;filter:blur(8px);transform:scale(1.02)}}
h1,h2,.cz{font-family:'Cinzel',serif;letter-spacing:.06em}
.ttl{font-weight:900;line-height:1;font-size:clamp(40px,9vw,88px);background:linear-gradient(100deg,#cdbfa6 25%,#fff 42%,#cdbfa6 58%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 6s linear infinite;filter:drop-shadow(0 4px 22px #ff4a3544)}
@keyframes shim{to{background-position:-250% 0}}
.sub{font:italic 500 clamp(18px,3vw,26px)/1.4 'Cormorant Garamond',serif;color:#ecdccb;max-width:560px}
h2{font-size:clamp(18px,3.4vw,26px);font-weight:700}
.btn{font:700 15px 'Cinzel',serif;letter-spacing:.14em;color:var(--cream);background:linear-gradient(#B8372B,#882720 60%,#6a1c16);border:0;padding:14px 36px;cursor:pointer;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);transition:filter .2s}
.btn:hover:not(:disabled){filter:brightness(1.15) drop-shadow(0 0 12px #ff4a35)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:9px 22px;font-size:12px}
.btn.gh{background:transparent;border:1px solid #F6F3EA88;clip-path:none}
.card{position:relative;border:1px solid #F6F3EA38;background:linear-gradient(160deg,rgba(62,20,16,.74),rgba(18,7,5,.9));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:22px;box-shadow:0 24px 60px #000a}
.card::before,.card::after{content:'';position:absolute;width:16px;height:16px;border:2px solid var(--cream)}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
input,textarea{width:100%;font:inherit;color:var(--cream);background:#0c0504b0;border:1px solid #F6F3EA55;padding:12px 14px;outline:0;resize:none}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.row{display:flex;gap:10px;width:100%}.row input:last-child{max-width:110px}
/* intro */
#s-intro{justify-content:flex-start;padding-top:min(12vh,110px);overflow:hidden}
#s-intro .ttl{font-size:clamp(46px,12vw,130px)}
.ldb{width:min(260px,70%);height:3px;background:#F6F3EA22}.ldb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#882720,#F6F3EA);transition:width .2s}
.statues{position:absolute;left:0;right:0;bottom:0;height:46vh;display:flex;justify-content:center;align-items:flex-end;pointer-events:none;z-index:-1;-webkit-mask:linear-gradient(transparent,#000 35%);mask:linear-gradient(transparent,#000 35%)}
.sl{position:relative;height:100%;aspect-ratio:2/3;margin:0 -3.2vw;flex:0 0 auto}
.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.sl .al{opacity:0;transition:opacity 1.3s}.sl.wake .al{opacity:1}
/* select */
.sel{display:flex;flex-direction:column;align-items:center;gap:8px;width:min(1000px,100%)}
.stage{position:relative;height:min(50vh,480px);aspect-ratio:2/3;margin:4px auto 10px}
.hero{height:100%;width:100%;object-fit:contain;filter:drop-shadow(0 20px 28px #000b);animation:flt 5s ease-in-out infinite alternate}
.hero.sw{animation:swap .5s ease,flt 5s ease-in-out .5s infinite alternate}
@keyframes flt{to{transform:translateY(-8px)}}@keyframes swap{from{opacity:0;transform:translateX(30px) scale(.96)}}
.nm{font:900 clamp(28px,5vw,46px) 'Cinzel',serif;letter-spacing:.1em}
.rl{font:italic 500 clamp(18px,2.8vw,24px) 'Cormorant Garamond',serif;color:#f0b6aa;margin-top:-6px}
.strip{display:flex;gap:10px;overflow-x:auto;padding:8px 6px;max-width:100%;justify-content:safe center;scrollbar-width:none}
.th{flex:0 0 62px;height:94px;border:1px solid #F6F3EA33;background:#0007;padding:2px;cursor:pointer;transition:.25s}
.th img{width:100%;height:100%;object-fit:contain}.th:hover{transform:translateY(-3px)}
.th.on{border-color:var(--cream);box-shadow:0 0 20px #ff5a3c99}
/* figure */
.big,.fg,.stage{position:relative}
.big{aspect-ratio:2/3;height:min(44vh,380px)}
.big::before,.stage::before{content:'';position:absolute;left:-8%;right:-8%;bottom:-8px;height:22px;border-radius:50%;background:radial-gradient(ellipse,#ff6a4acc,#88272055 55%,transparent 72%);filter:blur(4px)}
.fg svg,.big svg{width:100%;height:100%;display:block;position:relative}
.pulse{animation:pl 2.2s ease-in-out infinite}@keyframes pl{50%{opacity:.35}}
.sp{position:absolute;width:4px;height:4px;border-radius:50%;background:#F6F3EA;box-shadow:0 0 8px 2px #ff5a3c;pointer-events:none;animation:spk .8s ease-out forwards;z-index:3}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.hit{animation:hit .7s ease-out}
@keyframes hit{0%{transform:none;filter:none}20%{transform:scale(1.07) rotate(-1.2deg);filter:brightness(1.8) drop-shadow(0 0 34px #ff4a35)}45%{transform:scale(.98) rotate(.8deg)}100%{transform:none;filter:none}}
#fl{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 45%,#ff5a3c88,#88272055 45%,transparent 70%)}
#fl.on{animation:flsh .6s ease-out}@keyframes flsh{0%{opacity:1}100%{opacity:0}}
#bn2{position:fixed;inset:0;z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:0;background:radial-gradient(#000b,#0009)}
#bn2.on{animation:bn 1.2s ease-out}@keyframes bn{0%{opacity:0;transform:scale(1.5)}18%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(.97)}}
#bn2 b{font:900 clamp(40px,12vw,110px) 'Cinzel',serif;letter-spacing:.1em;text-shadow:0 0 40px #ff4a35,0 0 8px #882720}
#bn2 span{font:italic 500 clamp(18px,3.4vw,30px) 'Cormorant Garamond',serif;letter-spacing:.2em;color:#f0b6aa}
#mu{position:fixed;top:14px;right:14px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid #F6F3EA66;background:#0009;color:var(--cream);font-size:18px;cursor:pointer}#mu.off{opacity:.45;text-decoration:line-through}
/* play */
#s-play{padding-top:14px;justify-content:flex-start}
#hud{display:flex;align-items:center;gap:14px;width:min(940px,100%);padding-right:48px}
#pg{display:flex;gap:5px;flex:1}#pg i{flex:1;height:6px;background:#ffffff22;transition:.5s}#pg i.f{background:linear-gradient(90deg,#F6F3EA,#ff6a4a);box-shadow:0 0 10px #ff4a35}
#pcnt{font-size:20px;min-width:62px;text-align:right}
.pl{display:grid;grid-template-columns:minmax(200px,300px) minmax(0,560px);gap:26px;align-items:center;width:min(940px,100%);margin:auto}
#lv{font:700 13px 'Cinzel',serif;letter-spacing:.16em;color:#f0b6aa}
.st{font:500 clamp(22px,3.6vw,30px)/1.5 'Cormorant Garamond',serif;text-align:left;margin:12px 0 18px}
.bl{display:inline-block;min-width:64px;border-bottom:2px solid var(--cream);text-align:center;font-weight:700;color:#ffd9d0}.bl.ok{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.25)}}
.ans{color:#ffd9d0;font-weight:700;border-bottom:2px solid #ff6a4a}.ln2{color:#ff9a8a}
.opt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.b2{font:600 16px 'Prompt';color:var(--cream);background:#ffffff0d;border:1px solid #F6F3EA66;padding:13px 6px;min-height:54px;cursor:pointer;transition:.2s}.b2:hover:not(:disabled){background:#882720aa}
.b2.sel{background:#882720;border-color:#F6F3EA;box-shadow:0 0 18px #ff4a3566}
.b2.no{border-color:#ff6a4a;background:#882720cc;animation:sh .4s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.rv{display:flex;gap:12px;flex-wrap:wrap}
#hint{font-size:13px;color:var(--mut);text-align:left;margin-top:14px;font-weight:300}
.card.in{animation:cin .6s cubic-bezier(.2,.9,.3,1)}@keyframes cin{from{opacity:0;transform:translateY(30px) scale(.96)}}
#s-done .big{height:min(54vh,500px);filter:drop-shadow(0 0 34px #ff6a4a66)}
.rank{display:flex;flex-direction:column;gap:4px;min-width:min(340px,100%)}#dn{font-size:20px}#rk{font-size:30px;color:#ffd9d0}#bn{font-size:20px}
/* host */
#s-host{justify-content:flex-start;padding:18px 70px 18px 26px;align-items:stretch;text-align:left}
.hh{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.hh .ttl{font-size:44px}.hh .sp2{flex:1}
#hs{font:700 13px 'Cinzel',serif;letter-spacing:.2em;border:1px solid var(--cream);padding:6px 14px}#hs.live{background:var(--cr);border-color:#ff6a4a}
#hc,#ht{font:600 20px 'Cinzel',serif}
#hg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:18px}
.pc{position:relative;border:1px solid #F6F3EA30;background:linear-gradient(#3a1410cc,#130706ee);padding:8px 8px 12px;text-align:center}
.pc .fg{aspect-ratio:2/3;width:78%;margin:0 auto 8px}.pc b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc small{color:var(--mut)}
.pc i{display:block;height:5px;background:#ffffff1f;margin:6px 6px 4px}.pc u{display:block;height:100%;background:linear-gradient(90deg,#F6F3EA,#ff6a4a);transition:width 1s}
.pc em{font:700 12px 'Cinzel',serif;font-style:normal;letter-spacing:.1em}
.pc.done{border-color:var(--cream);box-shadow:0 0 28px #ff6a4a88;background:linear-gradient(#6a1c16cc,#2a0f0c)}
#tt{position:fixed;top:16px;left:50%;opacity:0;transform:translate(-50%,-220%);z-index:7;background:linear-gradient(#B8372B,#6a1c16);border:1px solid var(--cream);padding:12px 28px;font:700 18px 'Cinzel',serif;letter-spacing:.08em;box-shadow:0 10px 40px #000a;transition:transform .5s cubic-bezier(.2,1.2,.3,1),opacity .3s}#tt.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:1000px){.pl{grid-template-columns:340px 1fr;gap:40px}#s-play .big{height:min(480px,58vh)}.st{font-size:34px}.th{flex-basis:72px;height:108px}}
@media(max-width:760px){.pl{grid-template-columns:1fr;gap:10px}#s-play .big{height:32vh;margin:auto}}
@media(max-width:480px){.opt{grid-template-columns:1fr}.card{padding:16px}.btn{padding:13px 24px}.row{flex-direction:column}.row input:last-child{max-width:none}.stage{height:44vh}}
@media(max-height:520px) and (orientation:landscape){.pl{grid-template-columns:200px 1fr}#s-play .big{height:58vh}#s-done .big{height:50vh}.scr{padding:10px 16px}.stage{height:60vh}}
</style></head><body>
<div class="bg"></div><div id="petals"></div><div id="tt"></div>
<main>
<section id="s-intro" class="scr on">
  <div class="statues" id="stat"></div>
  <h1 class="ttl">Simi(a)live</h1>
  <p class="sub">Turned to stone. Brought back to life, one simile at a time.</p>
  <div class="ldb"><i id="ld"></i></div>
  <button class="btn" id="enter" disabled>Loading…</button>
</section>
<section id="s-char" class="scr">
  <h2>Choose who you will awaken</h2>
  <div class="sel">
    <div class="stage"><img class="hero" id="hero" alt=""></div>
    <div class="nm" id="cn2"></div><div class="rl" id="cr"></div>
    <div class="strip" id="th"></div>
    <button class="btn" id="cn">Continue</button>
  </div>
</section>
<section id="s-reg" class="scr">
  <h2 id="rt"></h2>
  <div class="big" id="rf"></div>
  <div class="card" style="width:min(420px,100%)">
    <div class="row"><input id="nm" maxlength="30" placeholder="Name · ชื่อ" autocomplete="off"><input id="no" type="number" min="1" max="60" placeholder="No. · เลขที่"></div>
    <p id="er" style="color:#ff9a8f;font-size:13px;min-height:20px;margin-top:8px"></p>
    <button class="btn" id="rg">Enter the waiting room</button>
  </div>
</section>
<section id="s-wait" class="scr">
  <h2>The chamber is silent</h2>
  <div class="big" id="wf"></div>
  <p class="sub pulse">Waiting for the host to begin the awakening…</p>
  <p class="cz"><span id="wn">1</span> statues in the room</p>
</section>
<section id="s-play" class="scr">
  <div id="hud"><div id="pg"></div><b id="pcnt" class="cz">0%</b></div>
  <div class="pl"><div class="big" id="pf"></div><div class="card"><div id="lv"></div><div id="qb"></div><p id="hint"></p></div></div>
</section>
<section id="s-done" class="scr">
  <div class="big" id="df"></div>
  <h1 class="ttl" style="font-size:clamp(32px,7vw,64px)">You are Simi(a)live!</h1>
  <div class="card rank"><div class="cz" id="dn"></div><div class="cz" id="rk"></div><div class="sub" id="bn"></div></div>
  <p class="sub" style="font-size:18px">Your answers will be checked by your teacher.</p>
</section>
<section id="s-host" class="scr">
  <div class="hh"><h1 class="ttl">Simi(a)live</h1><span id="hs">WAITING ROOM</span><span id="hc"></span><span id="ht"></span><span class="sp2"></span>
    <button class="btn sm" id="hb">Start game</button><button class="btn sm gh" id="hr">Reset</button></div>
  <div id="hg"></div>
</section>
</main>
<div id="fl"></div><div id="bn2"></div><button id="mu" aria-label="Music on/off" title="Music">♪</button>

function mock(a, d) {

  if (a === 'start') S.status = 'playing';

  if (a === 'answer' && P) {

  return Promise.resolve(S);
}

/* ---------- Questions ---------- */
const OPT = ['like', 'as … as', 'as if'];
const Q = [
  { t: 'c', s: 'My heart was beating __ a drum and I was completely captivated from then on.', a: 'like' },
  { t: 'c', s: 'Finally, the curtains lifted, but the stage was still __ dark __ night.', a: 'as … as' },
  { t: 'c', s: 'Our seats were very close to the stage – it felt so real, __ we were in the same room as the actors.', a: 'as if' },
  { t: 't', s: 'My sister covered her mouth with her hand, as if' },
  { t: 't', s: 'The water in the lake where we used to go swimming was like' },
  { t: 't', s: 'When I lost my teddy bear, I cried and cried as if' },
  { t: 't', s: 'I crept downstairs as quietly as' },
  { t: 't', s: 'My mother suddenly began sniffing the air like' },
  { t: 't', s: 'The two men stared at each other as if' }

/* ---------- Student flow ---------- */
const params = new URLSearchParams(location.search);
let cur = 's-intro', me = null, S = { status: 'waiting', players: [] }, qi = 0, att = 0, FIG = null, sel = 0, draft = '', timer = null;
const show = id => { document.querySelectorAll('.scr').forEach(e => e.classList.toggle('on', e.id === id)); cur = id; scrollTo(0, 0); };

function introInit() {
  const row = $('stat'), ids = [4, 2, 5, 0, 7, 3, 8];
  row.innerHTML = ids.map(i => `<div class="sl"><img src="${IS[i]}" alt=""><img class="al" src="${IA[i]}" alt=""></div>`).join('');
  setInterval(() => { const s = row.children[Math.random() * row.children.length | 0]; s.classList.add('wake'); setTimeout(() => s.classList.remove('wake'), 2400); }, 2600);
  $('enter').disabled = false; $('enter').textContent = 'Enter';
  $('enter').onclick = () => { if (me) { sel = me.char; join(); } else show('s-char'); };
}
function selInit() {
  $('th').innerHTML = CH.map((c, i) => `<button class="th" data-i="${i}" aria-label="${c.n}"><img src="${IA[i]}" alt=""></button>`).join('');
  $('th').onclick = e => { const b = e.target.closest('.th'); if (b) pickCh(+b.dataset.i); };
  $('cn').onclick = () => { $('rt').textContent = `${CH[sel].n}, ${CH[sel].r}`; $('rf').replaceChildren(fig(sel, 0)); show('s-reg'); };
  $('rg').onclick = async () => {
    const nm = $('nm').value.trim(), no = $('no').value.trim();
    if (!nm || !no) { $('er').textContent = 'Please enter your name and number. กรอกชื่อและเลขที่ให้ครบ'; return; }
    me = { id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), no, name: nm, char: sel };
    localStorage.simMe = JSON.stringify(me); await join();
  };
  pickCh(0);
}
function pickCh(i) {
  sel = i; const h = $('hero'); h.src = IA[i]; h.classList.remove('sw'); void h.offsetWidth; h.classList.add('sw');
  $('cn2').textContent = CH[i].n; $('cr').textContent = CH[i].r;
  document.querySelectorAll('.th').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
}
async function join() {
  $('rg').disabled = true; let ok = false;
  for (let i = 0; i < 5 && !ok; i++) {
    try { const r = await api('join', me); ok = !!r && r.ok !== false; } catch (e) {}
    if (!ok) await new Promise(z => setTimeout(z, 800 + Math.random() * 1500 + i * 800));
  }
  if (!ok) { $('er').textContent = 'Connection problem. Try again. เชื่อมต่อไม่ได้ ลองอีกครั้ง'; $('rg').disabled = false; show('s-reg'); return; }
  $('wf').replaceChildren(fig(me.char, 0)); show('s-wait'); poll(); pollLoop();
}
async function poll() {
  if (cur !== 's-wait') return;
  try { S = await api('state'); } catch (e) { return; }
  const m = S.players.find(p => p.id === me.id);
  $('wn').textContent = S.players.length;
  if (S.status === 'playing') startPlay(m ? m.progress : 0);
}
let pt = null;
function pollLoop() { clearTimeout(pt); pt = setTimeout(async () => { await poll(); if (cur === 's-wait') pollLoop(); }, 3500 + Math.random() * 2500); }
function startPlay(p) { sfx('start'); qi = p || 0; FIG = fig(me.char, qi / Q.length); $('pf').replaceChildren(FIG); show('s-play'); renderQ(); }
function renderQ() {
  if (qi >= Q.length) return finish();
  const q = Q[qi]; att = 0; draft = '';
  AU.int = qi / Q.length; document.body.style.setProperty('--heat', qi / Q.length); banner(qi);
  const cd = $('qb').parentElement; cd.classList.remove('in'); void cd.offsetWidth; cd.classList.add('in');
  $('lv').textContent = `LEVEL ${qi + 1} OF ${Q.length}`;
  $('pg').innerHTML = Q.map((_, i) => `<i class="${i < qi ? 'f' : ''}"></i>`).join(''); $('pcnt').textContent = Math.round(100 * qi / Q.length) + '%';
  q.t === 'c' ? renderChoice(q) : renderWrite(q);
}
function renderChoice(q) {
  $('hint').textContent = 'Pick the structure you think fits, then lock it in. เลือกคำที่คิดว่าถูก แล้วกดยืนยัน';
  $('qb').innerHTML = `<p class="st">${q.s.split('__').join('<span class="bl">&nbsp;</span>')}</p><div class="opt">${OPT.map(o => `<button class="b2">${o}</button>`).join('')}</div><div style="margin-top:14px"><button class="btn" id="ok" disabled>Lock it in</button></div>`;
  let ch = null;
  $('qb').querySelectorAll('.b2').forEach(b => b.onclick = () => {
    ch = b.textContent; sfx('click');
    $('qb').querySelectorAll('.b2').forEach(x => x.classList.toggle('sel', x === b));
    const f = ch === 'as … as' ? ['as', 'as'] : [ch, ch];
    $('qb').querySelectorAll('.bl').forEach((s, i) => { s.textContent = f[i]; s.classList.remove('ok'); void s.offsetWidth; s.classList.add('ok'); });
    $('ok').disabled = false;

}
function renderWrite(q) {
  $('hint').textContent = 'Invent your own simile: the more creative, the better! ยิ่งสร้างสรรค์ ยิ่งดี';
  $('qb').innerHTML = `<p class="st">${q.s} <span class="ln2">…</span></p><textarea id="ta" rows="3" maxlength="300" placeholder="Type your simile here"></textarea><div style="margin-top:14px"><button class="btn" id="go">Check my answer</button></div>`;
  const t = $('ta'); t.value = draft;
  $('go').onclick = () => {
    const v = t.value.trim();
    if (!v) { t.style.borderColor = '#ff6a4a'; t.placeholder = 'Write your idea first · พิมพ์ความคิดของเธอก่อนนะ'; sfx('bad'); return; }
    draft = v; review(q, v);
  };
}
function review(q, v) {
  $('hint').textContent = 'Read it aloud. Does it make sense? Is it creative? อ่านทวนอีกรอบก่อนไปข้อต่อไป';
  $('qb').innerHTML = `<p class="st">${q.s} <span class="ans"></span></p><div class="rv"><button class="btn sm gh" id="ed">Edit</button><button class="btn" id="ok">Lock it in</button></div>`;
  $('qb').querySelector('.ans').textContent = v;
  $('ed').onclick = () => renderWrite(q);
  $('ok').onclick = () => { $('ok').disabled = $('ed').disabled = true; sfx('good'); commit('write', v); };
}
let outbox = [], flushing = false;
function commit(type, text, ok) {
  const n = ++qi; sfx('build'); setP(FIG, n / Q.length, true); hit(FIG.parentElement);
  outbox.push({ id: me.id, no: me.no, name: me.name, qid: n, type, text, ok: !!ok, att: 0, retry: 0 });
  flush(); setTimeout(renderQ, 1700);
}
async function flush() { // ส่งทีละข้อตามลำดับ ส่งไม่สำเร็จจะลองใหม่เองจนกว่าจะสำเร็จ นักเรียนเล่นต่อได้ไม่ต้องรอ
  if (flushing) return; flushing = true;
  while (outbox.length) {
    const d = outbox[0]; let r = null;
    try { r = await api('answer', d); } catch (e) {}
    if (r && r.ok === false) { outbox.shift(); continue; }
    if (r && (r.ok || r.players)) { outbox.shift(); gotRank(r); }
    else { d.retry++; await new Promise(z => setTimeout(z, 1500 + Math.random() * 2500)); }
  }
  flushing = false;
}
function gotRank(r) { const m = r.players ? r.players.find(p => p.id === me.id) : r; if (m && m.rank) { me.rank = m.rank; me.bonus = m.bonus; if (cur === 's-done') doneInfo(me); } }
function finish() {
  show('s-done'); const F = fig(me.char, 0); $('df').replaceChildren(F);
  $('dn').textContent = `${me.name} · No. ${me.no}`; $('rk').textContent = 'Awakened'; $('bn').textContent = '';
  setTimeout(() => { setP(F, 1, true); sfx('build'); hit($('df')); burst(F); }, 300); setTimeout(() => sfx('win'), 1800);
  doneInfo(me);
}
function doneInfo(m) {
  if (!m || !m.rank) return;
  $('rk').textContent = `You finished #${m.rank}`; $('bn').textContent = `Speed bonus +${m.bonus}, added once your answers are checked.`;
}

/* ---------- Host screen ---------- */
const cards = {}; let t0 = 0;
function hostInit() {
  show('s-host');
  const key = demo ? '' : (prompt('Host key / รหัสโฮสต์') || '');
  $('hb').onclick = () => hostCmd('start', key);
  $('hr').onclick = () => { if (confirm('Reset the game and clear all players?')) hostCmd('reset', key); };
  const tick = () => api('state').then(hostRender).catch(() => {});
  tick(); setInterval(tick, 2000);
  setInterval(() => { if (t0) { const s = (Date.now() - t0) / 1000 | 0; $('ht').textContent = String(s / 60 | 0).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); } else $('ht').textContent = ''; }, 1000);
}
async function hostCmd(a, key) { // ส่งคำสั่งโฮสต์ ลองซ้ำเองถ้าเครือข่ายสะดุด
  for (let i = 0; i < 6; i++) {
    try { const r = await api(a, { key }); if (r.err) { alert('Wrong host key · รหัสโฮสต์ไม่ถูกต้อง'); return; } hostRender(r); return; }
    catch (e) { await new Promise(z => setTimeout(z, 700 * (i + 1))); }
  }
  alert('Cannot reach the server. Press the button again. · เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กดอีกครั้ง');
}
function toast(m) { const t = $('tt'); t.textContent = m; t.classList.add('on'); clearTimeout(t.h); t.h = setTimeout(() => t.classList.remove('on'), 3800); }
function hostRender(s) {
  const live = s.status === 'playing', g = $('hg'), ids = s.players.map(p => p.id);
  if (live && !t0) t0 = Date.now(); if (!live) t0 = 0;
  $('hs').textContent = live ? 'LIVE' : 'WAITING ROOM'; $('hs').classList.toggle('live', live);
  $('hc').textContent = live ? `${s.players.filter(p => p.status === 'done').length} / ${s.players.length} awakened` : `${s.players.length} in the room`;
  $('hb').disabled = live || !s.players.length;
  Object.keys(cards).forEach(k => { if (!ids.includes(k)) { cards[k].remove(); delete cards[k]; } });
  [...s.players].sort((a, b) => (a.status === 'done' ? 0 : 1) - (b.status === 'done' ? 0 : 1) || (a.status === 'done' ? a.rank - b.rank : b.progress - a.progress)).forEach(p => {
    let c = cards[p.id];
    if (!c) {
      c = cards[p.id] = document.createElement('div'); c.className = 'pc';
      c.innerHTML = '<div class="fg"></div><b></b><small></small><i><u></u></i><em></em>';
      c.querySelector('.fg').append(fig(p.char, 0));
    }
    c.querySelector('b').textContent = p.name; c.querySelector('small').textContent = `No. ${p.no} · ${CH[p.char].n}`;
    c.querySelector('u').style.width = (100 * p.progress / p.total) + '%';
    c.querySelector('em').textContent = p.status === 'done' ? `#${p.rank}  ·  +${p.bonus}` : live ? `${p.progress} / ${p.total}` : 'ready';
    c.classList.toggle('done', p.status === 'done');
    if (p.status === 'done' && !c.dataset.d) { c.dataset.d = 1; if (AU.c) { sfx('win'); toast(`${p.name} has awakened!  #${p.rank} · +${p.bonus}`); } }
    const sv = c.querySelector('svg'), t = p.progress / p.total; if (+sv.dataset.p !== t) setP(sv, t, true);
    g.append(c);
  });
}

/* ---------- Music & SFX (สร้างเสียงเองด้วย WebAudio ไม่ต้องมีไฟล์) ---------- */
const BGM_URL = ''; // ใส่ลิงก์เพลง .mp3 ของตัวเองได้ (เว้นว่าง = ใช้เพลงที่เกมสร้างเอง)
const AU = { c: null, m: null, a: null, on: true, int: 0 };
function auInit() {
  if (AU.c) return;
  const C = AU.c = new (window.AudioContext || window.webkitAudioContext)();
  AU.m = C.createGain(); AU.m.gain.value = AU.on ? .6 : 0; AU.m.connect(C.destination);
  if (BGM_URL) { AU.a = new Audio(BGM_URL); AU.a.loop = true; AU.a.volume = .4; AU.a.muted = !AU.on; AU.a.play().catch(() => {}); } else bar();
}
function tone(f, d, type = 'sine', v = .2, t = 0, to) {
  if (!AU.c) return;
  const C = AU.c, o = C.createOscillator(), g = C.createGain(), s = C.currentTime + t;
  o.type = type; o.frequency.setValueAtTime(f, s); if (to) o.frequency.exponentialRampToValueAtTime(to, s + d);
  g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(v, s + .02); g.gain.exponentialRampToValueAtTime(0.0001, s + d);
  o.connect(g); g.connect(AU.m); o.start(s); o.stop(s + d + .05);
}
function pad(f, d) {
  const C = AU.c, s = C.currentTime, g = C.createGain(), lp = C.createBiquadFilter();
  lp.type = 'lowpass'; lp.frequency.value = 1100;
  g.gain.setValueAtTime(.0001, s); g.gain.linearRampToValueAtTime(.05, s + .35); g.gain.linearRampToValueAtTime(.0001, s + d);
  [['sawtooth', -6], ['sawtooth', 6]].forEach(([ty, dt]) => { const o = C.createOscillator(); o.type = ty; o.frequency.value = f; o.detune.value = dt; o.connect(lp); o.start(s); o.stop(s + d + .1); });
  lp.connect(g); g.connect(AU.m);
}
function noise(d, v, t, hp) {
  const C = AU.c, n = C.sampleRate * d | 0, b = C.createBuffer(1, n, C.sampleRate), x = b.getChannelData(0);
  for (let i = 0; i < n; i++) x[i] = Math.random() * 2 - 1;
  const s = C.createBufferSource(), f = C.createBiquadFilter(), g = C.createGain(), st = C.currentTime + t;
  s.buffer = b; f.type = 'highpass'; f.frequency.value = hp; g.gain.setValueAtTime(v, st); g.gain.exponentialRampToValueAtTime(0.0001, st + d);
  s.connect(f); f.connect(g); g.connect(AU.m); s.start(st);
}
/* Am - F - Dm - E : มืด ตึง และยกขึ้นไปค้างที่ E ทุกรอบ */
const CHD = [[[220, 261.63, 329.63], 110], [[174.61, 220, 261.63], 87.31], [[146.83, 220, 293.66], 73.42], [[164.81, 207.65, 329.63], 82.41]];
let bi = 0;
function bar() {
  if (!AU.c) return;
  const [ch, bs] = CHD[bi++ % 4], q = AU.int, B = .55 - q * .12, D = B * 4;
  ch.forEach(f => pad(f, D + .3)); if (q > .3) pad(ch[0] * 2.119, D + .3);
  for (let i = 0; i < 8; i++) tone(bs, B * .45, 'sawtooth', i % 2 ? .08 : .13, i * B / 2);
  for (let k = 0; k < 4; k++) { tone(100, .22, 'sine', .5, k * B, 38); noise(.04, .1, k * B + B / 2, 6000); if (k % 2) noise(.16, .22, k * B, 1200); }
  if (q > .4) for (let k = 0; k < 8; k++) noise(.03, .07, k * B / 2 + B / 4, 7000);
  for (let i = 0; i < 8; i++) tone(ch[i % 3] * (i % 4 === 3 ? 4 : 2), .22, 'triangle', .05 + q * .05, i * D / 8);
  setTimeout(bar, D * 1000 - 60);
}
function sfx(n) {
  if (!AU.c) return;
  if (n === 'click') tone(620, .08, 'triangle', .15);
  if (n === 'lvl') { tone(110, .6, 'sawtooth', .1, 0, 440); tone(60, .5, 'sine', .5, 0, 30); }
  if (n === 'good') [523, 659, 784, 1046].forEach((f, i) => tone(f, .35, 'triangle', .18, i * .07));
  if (n === 'bad') tone(220, .3, 'sawtooth', .12, 0, 110);
  if (n === 'build') { tone(180, 1, 'sawtooth', .05, 0, 900); [784, 988, 1175].forEach((f, i) => tone(f, .8, 'sine', .1, .5 + i * .1)); }
  if (n === 'start') { tone(70, .7, 'sine', .5, 0, 35); tone(110, 1.2, 'sawtooth', .06, 0, 440); }
  if (n === 'win') [392, 494, 587, 784, 988, 1175].forEach((f, i) => tone(f, 1.6, 'triangle', .14, i * .12));
}
$('mu').onclick = () => { auInit(); AU.on = !AU.on; AU.m.gain.value = AU.on ? .6 : 0; if (AU.a) AU.a.muted = !AU.on; $('mu').classList.toggle('off', !AU.on); };
document.addEventListener('pointerdown', auInit, { once: true });
document.addEventListener('click', e => { if (e.target.closest('.btn,.th')) sfx('click'); });

/* ---------- Boot ---------- */
for (let i = 0; i < 18; i++) {

  $('petals').append(e);
}
(async () => {
  await loadAssets();
  if (params.has('host')) return hostInit();
